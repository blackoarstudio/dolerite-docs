<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != '/' %}{{ page.title }} — {{ site.title }} documentation{% else %}{{ site.title }} — theme documentation{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/docs.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <a class="topbar__brand" href="{{ '/' | relative_url }}">
      <span class="topbar__mark" aria-hidden="true"></span>
      {{ site.title }}<span class="topbar__sub">docs</span>
    </a>
    <button class="topbar__toggle" type="button" aria-expanded="false" aria-controls="sidebar">
      <span aria-hidden="true">☰</span>
      <span class="sr-only">Show navigation</span>
    </button>
  </header>

  <div class="shell">
    <nav class="sidebar" id="sidebar" aria-label="Documentation">
      <ol class="sidebar__list">
        {%- for item in site.data.nav -%}
        {%- assign target = item.url | relative_url -%}
        <li>
          <a href="{{ target }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
        </li>
        {%- endfor -%}
      </ol>
    </nav>

    <main class="content" id="main">
      {{ content }}

      <footer class="pagefoot">
        <p>Documentation for the {{ site.title }} Shopify theme.
          <a href="{{ '/support/' | relative_url }}">Need help?</a></p>
      </footer>
    </main>
  </div>

  <script>
    (function () {
      var btn = document.querySelector('.topbar__toggle');
      var nav = document.getElementById('sidebar');
      if (btn && nav) {
        btn.addEventListener('click', function () {
          var open = nav.classList.toggle('is-open');
          btn.setAttribute('aria-expanded', String(open));
          btn.querySelector('.sr-only').textContent = open ? 'Hide navigation' : 'Show navigation';
        });
      }

      /* Kramdown emits a bare <table>. Most of the reference content is tables,
         and several are wider than a phone — give each one its own scroll
         container so the page body never scrolls sideways. */
      var tables = document.querySelectorAll('.content table');
      for (var i = 0; i < tables.length; i++) {
        var t = tables[i];
        if (t.parentNode.classList.contains('table-wrap')) continue;
        var wrap = document.createElement('div');
        wrap.className = 'table-wrap';
        t.parentNode.insertBefore(wrap, t);
        wrap.appendChild(t);
      }
    })();
  </script>
</body>
</html>
